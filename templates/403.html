{% extends 'store/base.html' %}
{% block title %}Access denied — Northstar Store{% endblock %}
{% block content %}
<section class="error-page container">
    <span class="error-code">403</span>
    <h1>That shelf is off limits.</h1>
    <p class="lead">You do not have permission to view this page.</p>
    <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
        <a class="btn btn-brand rounded-pill px-4" href="{% url 'store:home' %}"><i class="bi bi-house me-2"></i>Back to home</a>
        {% if not user.is_authenticated %}<a class="btn btn-outline-dark rounded-pill px-4" href="{% url 'store:login' %}">Sign in</a>{% endif %}
    </div>
</section>
{% endblock %}
